<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Latihan matematika interaktif kelas 4 SD" />
  <title>Matematika Seru - Kelas 4 SD</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">

    <!-- HOME -->
    <section id="home" class="screen active">
      <h1>🧮 Matematika Seru</h1>
      <p class="subtitle">Kelas 4 SD</p>
      <p class="greeting" id="greeting"></p>
      <div class="stats-bar">
        <div class="stat"><span class="stat-value" id="totalStars">0</span><span class="stat-label">⭐ Bintang</span></div>
        <div class="stat"><span class="stat-value" id="totalCorrect">0</span><span class="stat-label">✅ Benar</span></div>
        <div class="stat"><span class="stat-value" id="bestStreak">0</span><span class="stat-label">🔥 Streak</span></div>
      </div>
      <div id="topicGrid" class="topic-grid"></div>
    </section>

    <!-- LEVEL SELECT -->
    <section id="levels" class="screen">
      <button class="back-btn" data-back="home">← Kembali</button>
      <h2 id="levelTitle"></h2>
      <p class="hint">Pilih level. Semakin tinggi, semakin menantang!</p>
      <div id="levelGrid" class="level-grid"></div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="screen">
      <button class="back-btn" data-back="levels">← Kembali</button>
      <div class="quiz-header">
        <div class="quiz-progress" id="quizProgress"></div>
        <div class="streak-display" id="streakDisplay">🔥 0</div>
      </div>
      <div class="question-box">
        <p id="question" class="question"></p>
      </div>
      <div id="quizOptions" class="quiz-options"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="primary-btn hidden">Lanjut →</button>
    </section>

    <!-- RESULT -->
    <section id="result" class="screen">
      <h2 id="resultTitle">🎉 Selesai!</h2>
      <div class="result-stars" id="resultStars"></div>
      <div class="result-score" id="resultScore">0 / 0</div>
      <p class="result-message" id="resultMessage"></p>
      <button id="retryBtn" class="primary-btn">🔁 Coba Lagi</button>
      <button class="back-btn full" data-back="home">🏠 Menu Utama</button>
    </section>

  </div>
  <div id="confetti"></div>
  <script src="js/app.js"></script>
</body>
</html>
